name: Testes

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Build
        run: yarn build
      - name: Instalar o Chromium do Playwright
        run: yarn playwright install --with-deps chromium
      - name: Testes de tela (Playwright, celular e desktop)
        run: yarn test:e2e
      - name: Relatório dos testes (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
